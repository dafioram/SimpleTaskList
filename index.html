<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <meta name="description" content="Track tasks and their status. Works offline; your tasks stay on this device.">
    <meta name="theme-color" content="#121212">
    <meta name="color-scheme" content="dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tasks">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <title>Tasks</title>
    <script src="vendor/Sortable.min.js" defer></script>
    <script src="store.js" defer></script>
    <script src="importer.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="topbar-row">
            <h1 class="app-title">Tasks <span id="active-count" class="count"></span></h1>
            <button type="button" id="filter-btn" class="icon-btn" aria-label="Filters">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 5h18l-7 8.5V19l-4 2v-7.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                <span id="filter-badge" class="badge" hidden></span>
            </button>
            <button type="button" id="menu-btn" class="icon-btn" aria-label="Menu">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></svg>
                <span id="menu-dot" class="dot" hidden></span>
            </button>
        </div>
        <div class="search-wrapper">
            <input type="search" id="task-search" class="search-input" placeholder="🔍 Search title, details, or #ID"
                   autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search tasks">
            <button type="button" id="clear-search" class="clear-search-btn" aria-label="Clear search" hidden>&times;</button>
        </div>
        <div id="active-filters" class="active-filters" hidden></div>
    </header>

    <main>
        <div id="banner" class="banner" role="alert" hidden></div>

        <form id="add-form" class="add-container" autocomplete="off">
            <div class="form-row-main">
                <input type="text" id="add-content" name="content" placeholder="Add a task..." enterkeyhint="done" aria-label="New task" maxlength="2000">
                <button type="submit" class="add-btn" aria-label="Add task">+</button>
            </div>
            <div id="add-labels" class="label-field compact"></div>
        </form>

        <div id="task-list" class="task-list"></div>
        <div id="empty-state" class="empty-state" hidden></div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
        <span id="toast-text"></span>
        <button type="button" id="toast-action" class="toast-action" hidden></button>
    </div>

    <!-- Edit task -->
    <dialog id="edit-sheet" class="sheet" aria-labelledby="edit-title">
        <form id="edit-form" class="sheet-inner" autocomplete="off" novalidate>
            <div class="sheet-grabber" aria-hidden="true"></div>
            <div class="sheet-header">
                <h2 id="edit-title">Edit Task <span id="edit-id" class="muted-id"></span></h2>
                <button type="button" class="icon-btn" data-close aria-label="Close">&times;</button>
            </div>
            <div class="sheet-body">
                <div id="edit-error" class="form-error" role="alert" hidden></div>

                <textarea id="edit-content" name="content" class="main-input" rows="1" required maxlength="2000" aria-label="Task"></textarea>
                <textarea id="edit-context" name="context" rows="3" placeholder="Add details, links, or notes... (wrap code in ```)" aria-label="Details"></textarea>

                <div class="form-group">
                    <label>Labels</label>
                    <div id="edit-labels" class="label-field"></div>
                </div>

                <div class="metadata-row">
                    <div class="form-group">
                        <label for="edit-assignee">Assignee</label>
                        <input type="text" id="edit-assignee" name="assignee" placeholder="Unassigned" autocapitalize="words" maxlength="50">
                        <div id="assignee-suggestions" class="suggestions"></div>
                    </div>
                    <div class="form-group">
                        <label for="edit-due">Due date</label>
                        <input type="date" id="edit-due" name="due_date">
                        <div class="suggestions">
                            <button type="button" class="sugg" data-due="0">Today</button>
                            <button type="button" class="sugg" data-due="1">Tomorrow</button>
                            <button type="button" class="sugg" data-due="7">+1 week</button>
                            <button type="button" class="sugg" data-due="">Clear</button>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Requires <span class="hint">(must be done before this task)</span> <span id="dep-count" class="hint"></span></label>
                    <input type="search" id="dep-search" placeholder="Filter tasks..." autocomplete="off" enterkeyhint="search" aria-label="Filter prerequisite tasks">
                    <div id="dep-list" class="dep-list" role="group" aria-label="Prerequisites"></div>
                </div>

                <div id="completion-group" class="form-group completion-group" hidden>
                    <label for="edit-note">Completion note</label>
                    <textarea id="edit-note" name="completion_note" class="note-area" rows="3" placeholder="Add details about how this was resolved..."></textarea>
                </div>
            </div>
            <div class="sheet-footer btn-group">
                <button type="button" id="edit-delete" class="btn delete-btn-modal">Delete</button>
                <button type="button" class="btn cancel-btn" data-close>Cancel</button>
                <button type="submit" class="btn save-btn">Save</button>
            </div>
        </form>
    </dialog>

    <!-- Filters -->
    <dialog id="filter-sheet" class="sheet" aria-labelledby="filter-title">
        <div class="sheet-inner">
            <div class="sheet-grabber" aria-hidden="true"></div>
            <div class="sheet-header">
                <h2 id="filter-title">Filters</h2>
                <button type="button" class="icon-btn" data-close aria-label="Close">&times;</button>
            </div>
            <div class="sheet-body">
                <section class="filter-section" id="label-section">
                    <div class="filter-section-head">
                        <h3>Label</h3>
                        <button type="button" id="toggle-empty-labels" class="text-btn">Show empty labels</button>
                    </div>
                    <div id="label-pills" class="filter-bar"></div>
                </section>
                <section class="filter-section" id="person-section">
                    <h3>Person</h3>
                    <div id="person-pills" class="filter-bar"></div>
                </section>
                <section class="filter-section">
                    <h3>Due date</h3>
                    <div id="due-pills" class="filter-bar"></div>
                </section>
                <section class="filter-section">
                    <h3>Dependency status</h3>
                    <div id="rel-pills" class="filter-bar"></div>
                </section>
            </div>
            <div class="sheet-footer btn-group">
                <button type="button" id="clear-filters" class="btn cancel-btn">Clear all</button>
                <button type="button" class="btn save-btn" data-close>Done</button>
            </div>
        </div>
    </dialog>

    <!-- Menu -->
    <dialog id="menu-sheet" class="sheet" aria-labelledby="menu-title">
        <div class="sheet-inner">
            <div class="sheet-grabber" aria-hidden="true"></div>
            <div class="sheet-header">
                <h2 id="menu-title">Menu</h2>
                <button type="button" class="icon-btn" data-close aria-label="Close">&times;</button>
            </div>
            <div class="sheet-body menu-list">
                <button type="button" class="menu-item" id="menu-jump">⬇️ <span>Jump to last unfinished</span></button>
                <button type="button" class="menu-item" id="menu-install" hidden>📲 <span>Install app</span></button>
                <button type="button" class="menu-item" id="menu-export">💾 <span>Export backup<small id="last-export"></small></span></button>
                <button type="button" class="menu-item" id="menu-import">📂 <span>Import backup or old tasks.db<small>Replaces the tasks on this device</small></span></button>
                <button type="button" class="menu-item" id="menu-persist" hidden>🔒 <span>Keep my tasks safe<small>Ask the browser not to clear this app's storage</small></span></button>
                <div id="storage-info" class="storage-info"></div>
            </div>
        </div>
    </dialog>

    <input type="file" id="import-file" accept=".json,.db,.sqlite,.sqlite3,application/json,application/octet-stream" hidden>
</body>
</html>
