# Builds the Android app (an APK) from the web files. GitHub Pages still serves
# the repo root as the web app; this workflow only adds an Android build.
name: Android app

on:
  push:
    branches: [static-app]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release to attach the APK to, e.g. v1.0.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 needs JDK 21. The runner already has the Android SDK.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # Generates android/ from the web files. versionCode must rise with every run.
      - run: npm run android:add
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            ./gradlew --no-daemon assembleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            echo "::warning::No signing secrets: built an unsigned debug APK. It can't update an installed copy of the app."
            ./gradlew --no-daemon assembleDebug
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: simpletasklist-android
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # Attaches the signed APK to a release as tasks_<tag>.apk. Runs for a published
  # release, or for a manual run that names an existing release tag.
  attach-to-release:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job may write to releases
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: simpletasklist-android

      - name: Attach tasks_<tag>.apk to the release
        run: |
          # Only the release-signed build goes on a release; a debug build would fail to install over it.
          apk=$(find . -name app-release.apk -print -quit)
          if [ -z "$apk" ]; then
            echo "::error::No release-signed APK to attach. Set the ANDROID_* secrets, then run again."
            exit 1
          fi
          cp "$apk" "tasks_${TAG}.apk"
          gh release upload "$TAG" "tasks_${TAG}.apk" --clobber
