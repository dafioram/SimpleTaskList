# Builds the Android app (an APK) from the web files. GitHub Pages still serves
# the repo root as the web app; this workflow only adds an Android build.
name: Android app

on:
  push:
    branches: [static-app]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 needs JDK 21. The runner already has the Android SDK.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # Generates android/ from the web files. versionCode must rise with every run.
      - run: npm run android:add
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            ./gradlew --no-daemon assembleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            echo "::warning::No signing secrets: built an unsigned debug APK. It can't update an installed copy of the app."
            ./gradlew --no-daemon assembleDebug
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: simpletasklist-android
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
