<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List</title>
	<style>
        body {
            background-color: #121212; color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 15px; max-width: 600px; margin: 0 auto;
        }

        /* --- Add Bar Container --- */
        .add-container {
            background: #1e1e1e; 
            padding: 15px; /* Increased padding */
            border-radius: 12px;
            margin-bottom: 25px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; /* Increased gap to stop overlapping */
        }

        .add-form { display: flex; gap: 10px; width: 100%; }
        
        input[type="text"] {
            flex-grow: 1; padding: 12px; border-radius: 8px; border: none; 
            font-size: 16px; background: #2c2c2c; color: white; outline: none;
        }

        /* FIXED: Purple Button is Back */
        button.add-btn {
            background-color: #bb86fc; /* Purple */
            color: #000; /* Black Text */
            border: none; padding: 0 20px;
            border-radius: 8px; font-weight: bold; font-size: 24px; cursor: pointer;
        }
        button.add-btn:hover {
            background-color: #a370db; /* Slightly darker purple on hover */
        }
        
        /* Color Radio Buttons */
        .color-selector { 
            display: flex; 
            gap: 15px; 
            padding-left: 5px; 
            align-items: center; /* Ensures dots align nicely */
        }
        
        .color-option { cursor: pointer; position: relative; display: flex; align-items: center; }
        .color-option input { display: none; } 

        .dot {
            width: 20px; height: 20px; border-radius: 50%; display: block;
            border: 2px solid transparent; opacity: 0.6; transition: all 0.2s;
        }
        /* Color Definitions */
        .dot.default { background-color: #555; }
        .dot.red { background-color: #ff5252; }
        .dot.orange { background-color: #ffab40; }
        .dot.blue { background-color: #448aff; }

        /* Selected State */
        .color-option input:checked + .dot {
            opacity: 1; transform: scale(1.2); border-color: #fff;
        }

        /* --- Task Card --- */
        .task-card {
            background-color: #1e1e1e; padding: 12px 15px; margin-bottom: 10px; 
            border-radius: 8px; display: flex; align-items: center; gap: 12px;
            border-left: 6px solid #333; 
        }

        /* Priority Borders */
        .task-card.border-red { border-left-color: #ff5252; }
        .task-card.border-orange { border-left-color: #ffab40; }
        .task-card.border-blue { border-left-color: #448aff; }

        /* Controls */
        .order-controls { display: flex; flex-direction: column; gap: 4px; }
        .arrow-btn { text-decoration: none; color: #555; font-size: 14px; line-height: 1; padding: 2px 6px; }
        .arrow-btn:hover { color: #fff; }

        .toggle-btn {
            width: 24px; height: 24px; border-radius: 50%; border: 2px solid #777;
            background: transparent; display: flex; align-items: center; justify-content: center;
            text-decoration: none; color: transparent; flex-shrink: 0;
        }
        .toggle-btn:hover { border-color: #fff; }

        .task-content { flex-grow: 1; display: flex; flex-direction: column; }
        .task-text { font-size: 1.1rem; color: #fff; word-break: break-word; }
        .task-date { font-size: 0.75rem; color: #666; margin-top: 4px; }

        .icon-btn { text-decoration: none; color: #444; font-size: 1.2rem; padding: 0 5px; }
        .icon-btn:hover { color: #fff; }
        .delete-btn:hover { color: #ff5252; }

        /* Completed State */
        .task-card.completed { opacity: 0.5; background-color: #181818; border-left-color: #222; }
        .task-card.completed .task-text { text-decoration: line-through; color: #888; }
        .task-card.completed .toggle-btn { background-color: #555; border-color: #555; color: #000; }
        .task-card.completed .order-controls { visibility: hidden; }
    </style>
</head>
<body>

    <div class="add-container">
        <form action="/add" method="POST">
            <div class="add-form">
                <input type="text" name="content" placeholder="Add a task..." required autocomplete="off">
                <button type="submit" class="add-btn">+</button>
            </div>
            <div class="color-selector">
                <label class="color-option"><input type="radio" name="color" value="default" checked><span class="dot default"></span></label>
                <label class="color-option"><input type="radio" name="color" value="red"><span class="dot red"></span></label>
                <label class="color-option"><input type="radio" name="color" value="orange"><span class="dot orange"></span></label>
                <label class="color-option"><input type="radio" name="color" value="blue"><span class="dot blue"></span></label>
            </div>
        </form>
    </div>

    <div id="task-list">
        {% for task in tasks %}
        <div class="task-card border-{{ task.color }} {{ 'completed' if task.completed_at else '' }}">
            
            <div class="order-controls">
                <a href="/move/{{ task.id }}/up" class="arrow-btn">▲</a>
                <a href="/move/{{ task.id }}/down" class="arrow-btn">▼</a>
            </div>

            <a href="/toggle/{{ task.id }}" class="toggle-btn">
                {% if task.completed_at %}✓{% endif %}
            </a>

            <div class="task-content">
                <span class="task-text">{{ task.content }}</span>
                <span class="task-date">
                    {% if task.completed_at %}Done: {{ task.completed_at.strftime('%b %d') }}
                    {% else %}Added: {{ task.created_at.strftime('%b %d') }}
                    {% endif %}
                </span>
            </div>
            
            <a href="/edit/{{ task.id }}" class="icon-btn">✎</a>

            <a href="/delete/{{ task.id }}" class="icon-btn delete-btn" 
               onclick="return confirm('Delete this task?');">×</a>
        </div>
        {% endfor %}
    </div>

    <div style="text-align: center; margin-top: 30px; margin-bottom: 50px;">
        <a href="/sweep" onclick="return confirm('Clear all finished tasks?');"
           style="color: #666; text-decoration: none; font-size: 0.9rem; border: 1px solid #333; padding: 8px 16px; border-radius: 20px;">
           🧹 Sweep Completed
        </a>
    </div>

</body>
</html>
